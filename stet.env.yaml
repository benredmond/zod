{
  "project_root": ".",
  "language": "javascript",
  "runtime_version": "24",
  "runtime_probe": {
    "command": "/opt/stet-nub/bin/nub node --version",
    "source": ".nvmrc",
    "match": "family",
    "exact": false
  },
  "pre_install": [
    "npm install --global --prefix /opt/stet-nub @nubjs/nub@0.8.3",
    "/opt/stet-nub/bin/nub node install 24"
  ],
  "install": [
    "/opt/stet-nub/bin/nub install --frozen-lockfile"
  ],
  "test_cmd": [
    "/opt/stet-nub/bin/nub run --recursive --filter zod --ignore-scripts build",
    "/opt/stet-nub/bin/nub scripts/write-stub-package-jsons.ts",
    "/opt/stet-nub/bin/nub run --recursive --filter @zod/mini --ignore-scripts build",
    "/opt/stet-nub/bin/nub run test",
    "/opt/stet-nub/bin/nub run --filter @zod/resolution test:all",
    "/opt/stet-nub/bin/nub run --filter @zod/integration test:all"
  ],
  "env_vars": {
    "PATH": "/opt/stet-nub/bin:$PATH",
    "XDG_CACHE_HOME": "/opt/stet-nub/cache"
  },
  "timeouts": {
    "install_sec": 900,
    "test_sec": 300
  }
}
